<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinatura Digital - GMF</title>
    <link rel="shortcut icon" href="../static/img/PMF_VERT_COR.ico" type="image/x-icon">
    <link rel="stylesheet" href="../static/styles/style.css">
    <!-- Incluindo jQuery a partir de um CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- Incluindo jQuery Mask a partir de um CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="image-container">
                <img src="../static/img/logo gmf.png" alt="Logo Guarda Municipal de Fortaleza" draggable="false">
                <img src="../static/img/PMF.png" alt="Logo Prefeitura de Fortaleza" draggable="false">
            </div>
            <div class="form-container">
                <h1>Assinatura de Email - Guarda Municipal de Fortaleza</h1>
                <form id="signature-form" action="/generate-signature" method="POST">

                    <label for="role">Cargo:</label>
                    <select id="role" name="role" required>
                        <option value="GD">Guarda</option>
                        <option value="SI">Subinspetor(a)</option>
                        <option value="INSP">Inspetor(a)</option>
                        <option value="ESTG">Estagiário (Bolsista)</option>
                        <option value="">Comissionado</option> <!-- Sumir CARGOS -->
                        <option value="">Tercerizado</option> <!-- Sumir CARGOS -->
                    </select>

                    <label for="name">Nome funcional:</label>
                    <input type="text" id="name" name="full_name" required maxlength="20">
                    <span class="example">Insira nome funcional (nome de guerra)</span>
                    
                    <label for="assignment">Atribuição:</label>
                    <select id="assignment" name="assignment" required>
                        <option value="Diretor a Geral">Diretor(a) Geral</option>
                        <option value="Diretor(a) adjuto(a)">Diretor(a) adjuto(a)</option>
                        <option value="Coordenador(a)">Coordenador(a)</option>
                        <option value="Chefe de Núcleo">Chefe de Núcleo</option>
                        <option value="Gerente">Gerente</option>
                        <option value="Comandante de Inspetoria">Comandante de Inspetoria</option>
                        <option value="Administrativo">Administrativo</option>
                        <option value="Técnico">Técnico</option>
                        <option value="Técnico-Administrativo">Técnico-Administrativo</option>
                    </select>
                    
                    <label for="department">Setor:</label>
                    <select id="department" name="department" required>
                        <option value="Arquivo/GMF">Arquivo/GMF</option>
                        <option value="Armaria/GMF">Armaria/GMF</option>
                        <option value="Asjur/GMF">Asjur/GMF</option>
                        <option value="Asplan/GMF">Asplan/GMF</option>
                        <option value="Cegea/GMF">Cegea/GMF</option>
                        <option value="Cegef/GMF">Cegef/GMF</option>
                        <option value="Cegepe/GMF">Cegepe/GMF</option>
                        <option value="Cetic/GMF">Cetic/GMF</option>
                        <option value="Coesp/GMF">Coesp/GMF</option>
                        <option value="Coinsp/GMF">Coinsp/GMF</option>
                        <option value="Nucont/GMF">Nucont/GMF</option>
                        <option value="Iterm/GMF">Iterm/GMF</option>
                        <option value="Compras/GMF">Compras/GMF</option>
                        <option value="Copcom/GMF">Copcom/GMF</option>
                        <option value="Coafi/GMF">Coafi/GMF</option>
                        <option value="Gemp/GMF">Gemp/GMF</option>
                        <option value="Gtam/GMF">Gtam/GMF</option>
                        <option value="Iciclo/GMF">Iciclo/GMF</option>
                        <option value="Direção Adjunta/GMF">Direção-Adjunta/GMF</option>
                        <option value="Direção Geral/GMF">Direção-Geral/GMF</option>
                        <option value="Nuplan/GMF">Nuplan/GMF</option>
                        <option value="Goe/GMF">Goe/GMF</option>
                        <option value="ISU/GMF">Isu/GMF</option>
                        <option value="ISE/GMF">Ise/GMF</option>
                        <option value="ISA/GMF">Isa/GMF</option>
                        <option value="IPAM/GMF">Ipam/GMF</option>
                        <option value="Nucoint/GMF">Nucoint/GMF</option>
                        <option value="Patrimônio/GMF">Patrimônio/GMF</option>
                        <option value="Logistica/GMF">Logistica/GMF</option>
                        <option value="Protocolo/GMF">Protocolo/GMF</option>
                        <option value="Transporte/GMF">Transporte/GMF</option>
                    </select>
                    
                    <label for="email">E-mail Institucional:</label>
                    <input type="email" id="email" name="email" value="@gmf.fortaleza.ce.gov.br" required>
                    <span class="example">Confira se seu e-mail institucional está corrreto!</span>
                    
                    <label for="phone">Número principal:<span class="required"> *</span></label>
                    <input type="tel" id="phone" name="phone" required>

                    <label for="phone-secondary">Número secudário:<span class="required">(Opcional)</span></label>
                    <input type="tel" id="phone-secondary" name="phone-secondary" >
                    
                    <div class="button-container">
                        <button type="submit">Gerar Assinatura</button>
                    </div>
                </form>
                <div id="result">
                    <h2>Sua assinatura:</h2>
                    <img id="signature-image" src="" alt="Assinatura Digital">
                    <a id="download-link" href="" download="assinatura.png">Baixar Assinatura</a>

                    <a id="download-link" href="../static/documents/Tutorial de edição - assinatura do e-mail institucional.pdf" download>Como adicionar a assinatura no email institucional</a>
                </div>

            </div>
        </div>
    </div>
    <footer>
        <p>Todos os direitos reservados &copy; 2025 - Guarda Municipal de Fortaleza</p>
    </footer>
    <script src="../static/js/script.js"></script>
</body>
</html>
